server {
  listen 80;

  # Serve the built React app
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }

  # Forward anything under /api/ to the backend container,
  # stripping the /api prefix before forwarding
  location /api/ {
    proxy_pass http://backend:3000/;
  }
}